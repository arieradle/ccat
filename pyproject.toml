[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccat"
version = "0.1.0"
description = "Cyclotomic Coefficient Arithmetic: exact, non-expanding cyclotomic valuations for q-factorial quotients, Gaussian binomials/multinomials, and stable Gaussian gcd theorems."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "sympy>=1.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccat"]
